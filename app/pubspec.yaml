name: diplomate
description: DiploMate - DNB theory exam prep by active recall.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  dio: ^5.10.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.3.1
  sentry_flutter: ^9.24.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - assets/fixtures/images/
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4[opsz,wght].ttf
        - asset: assets/fonts/SourceSerif4-Italic[opsz,wght].ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon-1024.png
  adaptive_icon_background: "#F6F8FA"
  adaptive_icon_foreground: assets/icon/icon-1024.png
