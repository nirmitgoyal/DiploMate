name: diplomate
description: DiploMate - DNB theory exam prep by active recall.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - assets/fixtures/images/
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4[opsz,wght].ttf
        - asset: assets/fonts/SourceSerif4-Italic[opsz,wght].ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
