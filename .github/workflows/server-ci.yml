name: server-ci
on:
  push:
    paths: ["server/**", "sql/**", "tools/db/**"]
jobs:
  contract-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: diplomate_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Apply migrations from zero (one schema truth)
        run: DATABASE_URL=postgres://postgres:postgres@localhost:5432/diplomate_test bash tools/db/apply.sh
      - name: Install
        working-directory: server
        run: npm ci || npm install
      - name: Contract suite
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/diplomate_test
        # npm test runs `node --test --test-concurrency=1`; the suite shares one
        # Postgres and TRUNCATEs between files, so it must run serially - a bare
        # `node --test` runs files in parallel and races on the shared DB.
        run: npm test
